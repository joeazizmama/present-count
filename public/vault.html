<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Void Vault — Whisper Archive</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%231a1816' stroke-width='4'/><circle cx='50' cy='50' r='6' fill='%231a1816'/></svg>">
  <style>
    /* Vault-specific styling */
    .vault-layout {
      max-width: 920px;
      margin: 0 auto;
      width: 100%;
      padding: 2.5rem 1.5rem 4rem;
      position: relative;
      z-index: 10;
    }

    .vault-gate-wrap {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vault-gate-card {
      width: 100%;
      max-width: 440px;
      padding: 3.5rem 2.5rem;
      border-radius: 26px;
      background: var(--bg-card);
      border: 1px solid var(--border-delicate);
      box-shadow: var(--shadow-subtle);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    .vault-key-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(26, 24, 22, 0.05);
      border: 1px solid var(--border-delicate);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: var(--accent-bronze);
    }

    .vault-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--ink-deep);
      margin-bottom: 0.5rem;
    }

    .vault-subtitle {
      font-size: 0.85rem;
      color: var(--ink-secondary);
      margin-bottom: 2rem;
    }

    .vault-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 0.95rem 1.25rem;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--ink-deep);
      outline: none;
      margin-bottom: 1.25rem;
      text-align: center;
      letter-spacing: 0.15em;
      transition: all 0.3s ease;
    }

    .vault-input:focus {
      background: #FFFFFF;
      border-color: var(--ink-deep);
      box-shadow: 0 4px 18px rgba(26, 24, 22, 0.08);
    }

    .vault-error {
      font-size: 0.78rem;
      color: #9C5146;
      margin-bottom: 1rem;
      min-height: 1.2rem;
      transition: opacity 0.3s ease;
    }

    /* Dashboard Header */
    .vault-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-delicate);
    }

    .vault-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .vault-brand-title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .vault-nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--border-delicate);
      border-radius: 9999px;
      padding: 0.45rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink-secondary);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      color: var(--ink-deep);
      border-color: var(--ink-deep);
      background: rgba(255, 255, 255, 0.5);
    }

    /* Metric Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-delicate);
      border-radius: 18px;
      padding: 1.5rem 1.75rem;
      backdrop-filter: blur(12px);
    }

    .metric-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    .metric-value {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--ink-deep);
    }

    /* Search & Filter Bar */
    .feed-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .search-input {
      flex: 1;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border-line);
      border-radius: 9999px;
      padding: 0.65rem 1.25rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--ink-deep);
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      background: #FFFFFF;
      border-color: var(--ink-deep);
    }

    .toolbar-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Secrets Feed */
    .secrets-feed {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .secret-card {
      background: var(--bg-card);
      border: 1px solid var(--border-delicate);
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
      backdrop-filter: blur(12px);
      transition: all 0.25s var(--ease-editorial);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .secret-card:hover {
      border-color: rgba(26, 24, 22, 0.16);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(26, 24, 22, 0.04);
    }

    .secret-text {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      line-height: 1.45;
      color: var(--ink-deep);
      font-style: italic;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .secret-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--ink-muted);
      border-top: 1px solid rgba(26, 24, 22, 0.05);
      padding-top: 0.75rem;
    }

    .secret-id-badge {
      font-family: monospace;
      background: rgba(26, 24, 22, 0.04);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .secret-actions-row {
      display: flex;
      gap: 0.75rem;
    }

    .action-icon-btn {
      background: none;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 0.74rem;
      font-weight: 500;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: color 0.2s ease;
    }

    .action-icon-btn:hover {
      color: var(--ink-deep);
    }

    .action-icon-btn.delete-btn:hover {
      color: #9C5146;
    }

    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--ink-muted);
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-style: italic;
    }

    @media (max-width: 680px) {
      .metrics-grid {
        grid-template-columns: 1fr;
      }
      .feed-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-input {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- STAGE 1: Passphrase Gate -->
  <div id="gateStage" class="vault-gate-wrap">
    <div class="vault-gate-card">
      <div class="vault-key-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="vault-title">The Void Vault</h1>
      <p class="vault-subtitle">Enter the sanctuary passphrase to view the whispers.</p>

      <form id="vaultGateForm">
        <input 
          type="password" 
          id="vaultPassInput" 
          class="vault-input" 
          placeholder="••••••••••••" 
          autocomplete="current-password"
          required 
          autofocus
        />
        <div id="vaultGateError" class="vault-error"></div>
        <button type="submit" class="primary-btn" style="width: 100%;">
          <span class="btn-text">Open the Vault</span>
        </button>
      </form>
    </div>
  </div>

  <!-- STAGE 2: Vault Dashboard -->
  <div id="dashboardStage" class="vault-layout" style="display: none;">
    <header class="vault-nav">
      <div class="vault-brand">
        <span class="brand-monogram">P / V</span>
        <h1 class="vault-brand-title">The Void Vault</h1>
      </div>
      <nav class="vault-nav-links">
        <a href="/" class="nav-btn">← Public Site</a>
        <button id="logoutBtn" class="nav-btn" type="button">Lock Vault</button>
      </nav>
    </header>

    <!-- Metrics Cards -->
    <section class="metrics-grid">
      <div class="metric-card">
        <p class="metric-label">Whispers in the Void</p>
        <p class="metric-value" id="metricSecrets">0</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Presence Count</p>
        <p class="metric-value" id="metricPresence">0</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Recorded Devices</p>
        <p class="metric-value" id="metricDevices">0</p>
      </div>
    </section>

    <!-- Toolbar -->
    <div class="feed-toolbar">
      <input 
        type="search" 
        id="searchSecrets" 
        class="search-input" 
        placeholder="Search whispers by keyword..."
      />
      <div class="toolbar-actions">
        <button id="refreshBtn" class="nav-btn" type="button">Refresh</button>
        <button id="exportBtn" class="nav-btn" type="button">Export JSON</button>
      </div>
    </div>

    <!-- Secrets Feed -->
    <main id="secretsFeed" class="secrets-feed">
      <!-- Injected via JavaScript -->
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const gateStage = document.getElementById('gateStage');
      const dashboardStage = document.getElementById('dashboardStage');
      const vaultGateForm = document.getElementById('vaultGateForm');
      const vaultPassInput = document.getElementById('vaultPassInput');
      const vaultGateError = document.getElementById('vaultGateError');
      const logoutBtn = document.getElementById('logoutBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const exportBtn = document.getElementById('exportBtn');
      const searchSecrets = document.getElementById('searchSecrets');
      const secretsFeed = document.getElementById('secretsFeed');

      const metricSecrets = document.getElementById('metricSecrets');
      const metricPresence = document.getElementById('metricPresence');
      const metricDevices = document.getElementById('metricDevices');

      let currentToken = sessionStorage.getItem('void_vault_token');
      let loadedSecrets = [];

      // Check existing session
      if (currentToken) {
        showDashboard();
      }

      vaultGateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        vaultGateError.textContent = '';
        const password = vaultPassInput.value;

        try {
          const res = await fetch('/api/vault/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          const data = await res.json();

          if (res.ok && data.token) {
            currentToken = data.token;
            sessionStorage.setItem('void_vault_token', currentToken);
            vaultPassInput.value = '';
            showDashboard();
          } else {
            vaultGateError.textContent = data.error || 'Incorrect passphrase.';
            vaultPassInput.focus();
            vaultPassInput.select();
          }
        } catch (err) {
          vaultGateError.textContent = 'Server connection error.';
        }
      });

      logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('void_vault_token');
        currentToken = null;
        dashboardStage.style.display = 'none';
        gateStage.style.display = 'flex';
        vaultPassInput.focus();
      });

      refreshBtn.addEventListener('click', loadVaultData);

      exportBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(loadedSecrets, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `void-secrets-export-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      searchSecrets.addEventListener('input', () => {
        renderFeed();
      });

      async function showDashboard() {
        gateStage.style.display = 'none';
        dashboardStage.style.display = 'block';
        await loadVaultData();
      }

      async function loadVaultData() {
        try {
          const res = await fetch('/api/vault/secrets', {
            headers: { 'Authorization': `Bearer ${currentToken}` }
          });

          if (res.status === 401) {
            // Expired or invalid token
            sessionStorage.removeItem('void_vault_token');
            currentToken = null;
            dashboardStage.style.display = 'none';
            gateStage.style.display = 'flex';
            vaultGateError.textContent = 'Session expired. Please re-enter passphrase.';
            return;
          }

          const data = await res.json();
          if (data.success) {
            metricSecrets.textContent = data.totalSecrets.toLocaleString();
            metricPresence.textContent = data.presenceCount.toLocaleString();
            metricDevices.textContent = data.totalDevices.toLocaleString();
            loadedSecrets = data.secrets || [];
            renderFeed();
          }
        } catch (err) {
          console.error('Failed to load vault secrets:', err);
        }
      }

      function formatTime(isoStr) {
        if (!isoStr) return 'Unknown date';
        try {
          const d = new Date(isoStr);
          if (isNaN(d.getTime())) return 'Unknown date';
          return d.toLocaleDateString(undefined, {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } catch (e) {
          return 'Unknown date';
        }
      }

      function renderFeed() {
        const query = (searchSecrets.value || '').trim().toLowerCase();
        const filtered = loadedSecrets.filter(s => {
          if (!s || typeof s !== 'object') return false;
          const text = (s.text || '').toLowerCase();
          const id = (s.id || '').toLowerCase();
          return !query || text.includes(query) || id.includes(query);
        });

        if (filtered.length === 0) {
          secretsFeed.innerHTML = `
            <div class="empty-state">
              ${query ? 'No whispers match your search.' : 'The void is silent. No whispers have been offered yet.'}
            </div>
          `;
          return;
        }

        secretsFeed.innerHTML = filtered.map(item => {
          const safeId = escapeHtml(item.id || 'unknown');
          const safeText = escapeHtml(item.text || '');
          const rawTextEncoded = encodeURIComponent(item.text || '');
          return `
          <article class="secret-card" id="card-${safeId}">
            <div class="secret-text">“${safeText}”</div>
            <div class="secret-meta">
              <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span class="secret-id-badge">${safeId}</span>
                <span>${formatTime(item.timestamp)}</span>
              </div>
              <div class="secret-actions-row">
                <button class="action-icon-btn copy-btn" data-text="${rawTextEncoded}">Copy</button>
                <button class="action-icon-btn delete-btn" data-id="${safeId}">Dissolve</button>
              </div>
            </div>
          </article>
        `;
        }).join('');

        // Attach action handlers
        secretsFeed.querySelectorAll('.copy-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const txt = decodeURIComponent(btn.dataset.text || '');
            navigator.clipboard.writeText(txt);
            const orig = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = orig; }, 1500);
          });
        });

        secretsFeed.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            if (!confirm('Dissolve this whisper permanently from the void?')) return;

            try {
              const res = await fetch(`/api/vault/secrets/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${currentToken}` }
              });
              if (res.ok) {
                loadedSecrets = loadedSecrets.filter(s => s && s.id !== id);
                metricSecrets.textContent = loadedSecrets.length.toLocaleString();
                renderFeed();
              }
            } catch (e) {
              alert('Could not dissolve whisper.');
            }
          });
        });
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    });
  </script>
</body>
</html>
